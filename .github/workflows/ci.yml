name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Postgres 16 (ADR 0001) as a service container: API tests and e2e run against a real database.
env:
  DATABASE_URL_TEST: postgres://calc:calc@localhost:5432/calc_test
  DATABASE_URL_E2E: postgres://calc:calc@localhost:5432/calc_e2e

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calc
          POSTGRES_PASSWORD: calc
          POSTGRES_DB: calc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calc" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Schema drift (hand-written migrations vs Drizzle schema)
        run: pnpm --filter @calc/server check:schema
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calc
          POSTGRES_PASSWORD: calc
          POSTGRES_DB: calc_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calc" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @calc/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
